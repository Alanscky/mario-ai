# ============================================================
# Configuración B
# Diferencias con A (solo estas dos, para poder atribuir el efecto):
#   1. action_set: SIMPLE_MOVEMENT (agrega izquierda y salto sin avanzar)
#   2. reward shaping: bonus por bandera y castigo extra al morir
# Hipótesis: más acciones permiten maniobrar en tubos/huecos y una
# señal de muerte más fuerte reduce los saltos arriesgados.
# ============================================================
name: config_b

action_set: SIMPLE_MOVEMENT  # 7 acciones
frame_skip: 4
frame_size: 84
frame_stack: 4
max_frames: 10000

reward:
  scale: 0.1
  flag_bonus: 500.0           # (x0.1 => +50)
  death_penalty: -250.0       # (x0.1 => -25)

seed: 42
n_envs: 8
total_timesteps: 2000000
ppo:
  learning_rate: 0.00025
  n_steps: 512
  batch_size: 256
  n_epochs: 4
  gamma: 0.9
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

checkpoint_every: 100000
